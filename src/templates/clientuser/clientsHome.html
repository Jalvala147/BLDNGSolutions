{% extends './base.html' %}

{% block title %}clients{% endblock %}

{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/clients.css')}}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css')}}">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0" />
{% endblock %}

{% block body %} 

<div class="logout">
  <a class="btn btn-secondary" href="{{ url_for('logoutemp') }}">Cerrar sesión</a>
</div>

<h2>Bienvenido, {{current_user.fullname}}</h2>

<header class="header">
    <nav>
        <div class="logo">
            <a title="logo" href="/startpage"><img src="static/images/logo.png" class="logo"/></a>
        </div>

    </nav>
</header>

<div class="navigation" align="center">
    <ul>
        <li class="list active" align="center">
            <a href="/docs">
                <span class="icon">
                    <span class="form-item-icon material-symbols-rounded">Description</span>
                </span>
                <span class="text">Documentos</span>
            </a>
        </li>
        <li class="list">
            <a href="/information">
                <span class="icon">
                    <span class="form-item-icon material-symbols-rounded">info</span>
                </span>
                <span class="text">Información</span>
            </a>
        </li>
        <li class="list">
            <a href="/payments">
                <span class="icon">
                    <span class="form-item-icon material-symbols-rounded">Payments</span>
                </span>
                <span class="text">Pagos</span>
            </a>
        </li>
        <li class="list">
            <a href="/progress">
                <span class="icon">
                    <span class="form-item-icon material-symbols-rounded">pending</span>
                </span>
                <span class="text">Progreso</span>
            </a>
        </li>
        <div class="indicator"></div>
    </ul>
</div>

<script>
    const list = document.querySelectorAll('.list');
    function activeLink() {
        list.forEach((item) => item.classList.remove('active'));
        this.classList.add('active');
    }
    list.forEach((item) => item.addEventListener('click', activeLink));
</script>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

{% endblock %}
