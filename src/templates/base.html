<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BLDNG Solutions{% endblock %}</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bldng-theme');
          if (t !== 'dark' && t !== 'light') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/erp-variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/theme-toggle.css') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.ico') }}">
    {% block customCSS %}{% endblock %}
  </head>
  <body>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="true" title="Cambiar a modo claro">
      <span class="material-symbols-rounded" data-theme-icon>light_mode</span>
      <span data-theme-label>Claro</span>
    </button>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  </body>
</html>
