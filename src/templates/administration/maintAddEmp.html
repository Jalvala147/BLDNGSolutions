{% extends './base.html' %}

{% block title%}Add Employee{% endblock %}

{% block customCSS %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/employeelist.css')}}">
<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,300,0,0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css')}}">
{% endblock %}


{% block body %}

<h1>Agregar nuevo empleado</h1>

<div class="login-card-container" align="center">
    <div class="login-card">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-item">
                <label for="username">Nombre de usuario:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-item">
                <label for="fullname">Nombre completo:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-item">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button type="submit">Agregar empleado</button>
        </form>
    </div>
</div>
{% endblock %}
